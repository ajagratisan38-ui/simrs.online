services:
  postgres:
    image: postgres:16-alpine
    container_name: simrs-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-simrs_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-simrs} -d ${POSTGRES_DB:-simrs_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: simrs-redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: simrs-server
    restart: always
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: production
      PORT: '4001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-simrs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-simrs_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MFA_ISSUER: ${MFA_ISSUER:-SIMRS SaaS}
      SATUSEHAT_CLIENT_ID: ${SATUSEHAT_CLIENT_ID:-}
      SATUSEHAT_CLIENT_SECRET: ${SATUSEHAT_CLIENT_SECRET:-}
      SATUSEHAT_BASE_URL: ${SATUSEHAT_BASE_URL:-}
      SATUSEHAT_ORG_ID: ${SATUSEHAT_ORG_ID:-}
      BPJS_CONSUMER_ID: ${BPJS_CONSUMER_ID:-}
      BPJS_CONSUMER_SECRET: ${BPJS_CONSUMER_SECRET:-}
      BPJS_BASE_URL: ${BPJS_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: simrs-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://server:4001/api/v1}
    depends_on:
      - server
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
